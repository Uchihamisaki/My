<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Art Gallery</title>
    <!-- ربط ملف الـ CSS المشترك -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

    <!-- شاشة تسجيل الدخول -->
    <div class="admin-box" id="loginScreen">
        <h2>Artist Login</h2>
        <div class="form-group">
            <label>Enter Secret Password:</label>
            <input type="password" id="passwordInput" placeholder="Password">
        </div>
        <button onclick="checkPassword()">Login</button>
        <a href="index.html" class="back-link">Back to Gallery</a>
    </div>

    <!-- لوحة التحكم لإضافة اللوحات -->
    <div class="admin-box dashboard-screen" id="dashboardScreen">
        <h2>Add New Artwork</h2>
        <div class="form-group">
            <label>Artwork Title:</label>
            <input type="text" id="artTitle" placeholder="e.g., Silent Night">
        </div>
        <div class="form-group">
            <label>High-Res Image URL:</label>
            <input type="text" id="artImage" placeholder="Paste direct image link here">
            <small style="color: #777; display:block; margin-top:5px;">Tip: Upload your image to ImgBB and paste the Direct Link.</small>
        </div>
        <div class="form-group">
            <label>Art Statement / Description:</label>
            <textarea id="artDesc" placeholder="Write the philosophy or inspiration behind your artwork..."></textarea>
        </div>
        <button onclick="addNewArt()">Publish Artwork</button>
        <a href="index.html" class="back-link">View Live Website</a>
    </div>

    <script>
        const MY_SECRET_PASSWORD = "itachi_san@8"; // كلمة المرور الخاصة بك

        function checkPassword() {
            const pass = document.getElementById('passwordInput').value;
            if (pass === MY_SECRET_PASSWORD) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'block';
            } else {
                alert("Incorrect password! Access denied.");
            }
        }

        function addNewArt() {
            const title = document.getElementById('artTitle').value;
            const image = document.getElementById('artImage').value;
            const description = document.getElementById('artDesc').value;

            if(!title || !image || !description) {
                alert("Please fill in all fields!");
                return;
            }

            const artworks = JSON.parse(localStorage.getItem('galleryArtworksList')) || [];
            
            artworks.unshift({
                title: title,
                image: image,
                description: description
            });

            localStorage.setItem('galleryArtworksList', JSON.stringify(artworks));

            alert("Artwork added successfully!");
            
            document.getElementById('artTitle').value = '';
            document.getElementById('artImage').value = '';
            document.getElementById('artDesc').value = '';
        }
    </script>

    <!-- ضعيه في آخر ملف admin.html قبل علامة </body> مباشرة -->
<script type="module">
  // هنا نجلب الأدوات التي نحتاجها من جوجل
  import { initializeApp } from "https://gstatic.com";
  import { getDatabase, ref, push, set } from "https://gstatic.com";

  // إعدادات موقعك الخاص في فايربيز
  const firebaseConfig = {
    apiKey: "AIzaSyBEifSy8WgG4Z3p9gbuwg1fX2n0udxE61c",
    authDomain: "://firebaseapp.com",
    projectId: "misaki-6c550",
    storageBucket: "misaki-6c550.firebasestorage.app",
    messagingSenderId: "106875309382",
    appId: "1:106875309382:web:804967b1184b9cd9daa947"
  };

  // تشغيل قاعدة البيانات
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // الكود المسؤول عن حفظ اللوحة في الإنترنت عند الضغط على الزر
  document.getElementById('saveButton').addEventListener('click', function() {
    // 1. جلب الكلام الذي كتبتيه داخل المربعات
    const titleInput = document.getElementById('panelTitle').value;
    const contentInput = document.getElementById('panelContent').value;

    // 2. إرسال الكلام إلى الإنترنت (قاعدة البيانات) للأبد
    const listRef = ref(db, 'panels');
    const newRef = push(listRef);
    
    set(newRef, {
      title: titleInput,
      content: contentInput
    }).then(() => {
      alert("تم الحفظ على الإنترنت بنجاح! ستظهر للجميع الآن.");
      // تنظيف المربعات بعد الحفظ
      document.getElementById('panelTitle').value = '';
      document.getElementById('panelContent').value = '';
    }).catch((error) => {
      alert("حدث خطأ، تأكدي من إعدادات قاعدة البيانات");
    });
  });
</script>

</body>
</html>
