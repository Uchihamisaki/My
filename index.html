<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misaki - Art Gallery</title>
    
    <!-- أيقونة المتصفح من رابط صورتكِ المباشر -->
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/XGSkcmf/02.jpg">

    <!-- كود السيو لجوجل بوصف موقعكِ المحدّد -->
    <meta name="description" content="A personal space showcasing my artistic vision and soul">

    <!-- أكواد المعاينة لمواقع التواصل ببيانات موقعكِ وصورتكِ -->
    <meta property="og:title" content="Misaki">
    <meta property="og:description" content="A personal space showcasing my artistic vision and soul">
    <meta property="og:image" content="https://i.ibb.co/XGSkcmf/02.jpg">
    <meta property="og:type" content="website">

    <!-- ربط ملف الـ CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <header>
        <h1>Misaki</h1>
        <p>A personal space showcasing my artistic vision and soul</p>
    </header>

    <main>
        <div class="gallery-grid" id="galleryContainer">
            <!-- اللوحات ستظهر هنا تلقائياً عن طريق الجافا سكريبت -->
        </div>
        <div id="panelsContainer"></div>

    </main>

    <!-- قسم التواصل بالبريد الإلكتروني -->
    <section class="contact-section">
        <h2>Get in Touch</h2>
        <p>For inquiries, commissions, or exhibitions, reach out to me directly:</p>
        <a href="mailto:artistaishabig@gmail.com" class="contact-email">artistaishabig@gmail.com</a>
    </section>

    <!-- زر لوحة التحكم -->
    <a href="admin.html" class="admin-link">Dashboard ⚙️</a>

    <!-- ربط ملف الـ JavaScript -->
    <script src="script.js"></script>

    <!-- ضعيه في آخر ملف index.html قبل علامة </body> مباشرة -->
<script type="module">
  // هنا نجلب أداة القراءة والقراءة التلقائية من جوجل
  import { initializeApp } from "https://gstatic.com";
  import { getDatabase, ref, onValue } from "https://gstatic.com";

  const firebaseConfig = {
    apiKey: "AIzaSyBEifSy8WgG4Z3p9gbuwg1fX2n0udxE61c",
    authDomain: "://firebaseapp.com",
    projectId: "misaki-6c550",
    storageBucket: "misaki-6c550.firebasestorage.app",
    messagingSenderId: "106875309382",
    appId: "1:106875309382:web:804967b1184b9cd9daa947"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // هنا الموقع يراقب الإنترنت، أول ما تضيفي لوحة يظهرها فوراً للزائر
  const panelsRef = ref(db, 'panels');
  onValue(panelsRef, (snapshot) => {
    const container = document.getElementById('panelsContainer');
    container.innerHTML = ''; // تنظيف المكان أولاً

    const data = snapshot.val();
    if (data) {
      // نمر على كل اللوحات المكتوبة في السيرفر ونعرضها واحدة تلو الأخرى
      Object.keys(data).forEach((key) => {
        const panel = data[key];
        
        // شكل اللوحة التي ستظهر للزائر
        const panelHTML = `
          <div class="panel-card">
            <h3>${panel.title}</h3>
            <p>${panel.content}</p>
          </div>
        `;
        container.innerHTML += panelHTML; // إضافتها داخل الصفحة
      });
    } else {
      container.innerHTML = '<p> There are no paintings currently on display. </p>';
    }
  });
</script>

    
</body>
</html>
