<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Art Gallery</title>
    <!-- ربط ملف الـ CSS المشترك -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

    <!-- شاشة تسجيل الدخول -->
    <div class="admin-box" id="loginScreen">
        <h2>Artist Login</h2>
        <div class="form-group">
            <label>Enter Secret Password:</label>
            <input type="password" id="passwordInput" placeholder="Password">
        </div>
        <button id="loginBtn">Login</button>
        <a href="index.html" class="back-link">Back to Gallery</a>
    </div>

    <!-- لوحة التحكم لإضافة اللوحات -->
    <div class="admin-box dashboard-screen" id="dashboardScreen" style="display: none;">
        <h2>Add New Artwork</h2>
        <div class="form-group">
            <label>Artwork Title:</label>
            <input type="text" id="artTitle" placeholder="e.g., Silent Night">
        </div>
        <div class="form-group">
            <label>High-Res Image URL:</label>
            <input type="text" id="artImage" placeholder="Paste direct image link here">
            <small style="color: #777; display:block; margin-top:5px;">Tip: Upload your image to ImgBB and paste the Direct Link.</small>
        </div>
        <div class="form-group">
            <label>Art Statement / Description:</label>
            <textarea id="artDesc" placeholder="Write the philosophy or inspiration behind your artwork..."></textarea>
        </div>
        <button id="publishBtn">Publish Artwork</button>
        <a href="index.html" class="back-link">View Live Website</a>
    </div>

    <!-- كود التشغيل والربط بـ Firebase السحابي -->
    <script type="module">
        // 1. جلب الأدوات الصحيحة من سيرفرات جوجل المحدثة
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, push, set } from "https://gstatic.com";

        // إعدادات موقعك الخاص والمكتمل في فايربيز
        const firebaseConfig = {
            apiKey: "AIzaSyBEifSy8WgG4Z3p9gbuwg1fX2n0udxE61c",
            authDomain: "misaki-6c550.firebaseapp.com",
            databaseURL: "https://firebaseio.com", // رابط الداتابيز المباشر
            projectId: "misaki-6c550",
            storageBucket: "misaki-6c550.firebasestorage.app",
            messagingSenderId: "106875309382",
            appId: "1:106875309382:web:804967b1184b9cd9daa947"
        };

        // تفعيل قاعدة البيانات السحابية
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // كلمة المرور السرية الخاصة بكِ
        const MY_SECRET_PASSWORD = "itachi_san@8"; 

        // تشغيل زر تسجيل الدخول
        document.getElementById('loginBtn').addEventListener('click', function() {
            const pass = document.getElementById('passwordInput').value;
            if (pass === MY_SECRET_PASSWORD) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'block';
            } else {
                alert("Incorrect password! Access denied.");
            }
        });

        // تشغيل زر النشر وحفظ البيانات في السحاب للأبد وللجميع
        document.getElementById('publishBtn').addEventListener('click', function() {
            const title = document.getElementById('artTitle').value;
            const image = document.getElementById('artImage').value;
            const description = document.getElementById('artDesc').value;

            // التأكد من ملء البيانات
            if(!title || !image || !description) {
                alert("Please fill in all fields!");
                return;
            }

            // إرسال اللوحة الفنية إلى الإنترنت لـ Firebase
            const galleryRef = ref(db, 'galleryArtworksList');
            const newArtworkRef = push(galleryRef); // عمل رقم مميز للوحة الجديدة
            
            set(newArtworkRef, {
                title: title,
                image: image,
                description: description,
                timestamp: Date.now() // ترتيب اللوحات من الأحدث للأقدم لاحقاً
            }).then(() => {
                alert("Artwork added to cloud successfully! It's now permanent.");
                
                // تنظيف خانات الإدخال بعد النشر بنجاح
                document.getElementById('artTitle').value = '';
                document.getElementById('artImage').value = '';
                document.getElementById('artDesc').value = '';
            }).catch((error) => {
                alert("Error connecting to cloud, please verify database rules.");
                console.error(error);
            });
        });
    </script>
</body>
</html>
