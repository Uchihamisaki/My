<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misaki - Art Gallery</title>
    
    <!-- أيقونة المتصفح من رابط صورتكِ المباشر -->
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/XGSkcmf/02.jpg">

    <!-- كود السيو لجوجل بوصف موقعكِ المحدّد -->
    <meta name="description" content="A personal space showcasing my artistic vision and soul">

    <!-- أكواد المعاينة لمواقع التواصل ببيانات موقعكِ وصورتكِ -->
    <meta property="og:title" content="Misaki">
    <meta property="og:description" content="A personal space showcasing my artistic vision and soul">
    <meta property="og:image" content="https://i.ibb.co/XGSkcmf/02.jpg">
    <meta property="og:type" content="website">

    <!-- ربط ملف الـ CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Misaki</h1>
        <p>A personal space showcasing my artistic vision and soul</p>
    </header>

    <main>
        <!-- هذا هو المكان المخصص لعرض شبكة اللوحات الفنية -->
        <div class="gallery-grid" id="galleryContainer">
            <!-- اللوحات والأسماء والصور ستظهر هنا تلقائياً من السحاب للأبد -->
        </div>
    </main>

    <!-- قسم التواصل بالبريد الإلكتروني -->
    <section class="contact-section">
        <h2>Get in Touch</h2>
        <p>For inquiries, commissions, or exhibitions, reach out to me directly:</p>
        <a href="mailto:artistaishabig@gmail.com" class="contact-email">artistaishabig@gmail.com</a>
    </section>

    <!-- زر لوحة التحكم -->
    <a href="admin.html" class="admin-link">Dashboard ⚙️</a>

    <!-- ربط ملف الـ JavaScript القديم إذا كان يحتوي على تأثيرات إضافية -->
    <script src="script.js"></script>

    <!-- كود القراءة التلقائية والسحرية من الـ Firebase Cloud -->
    <script type="module">
        // 1. استدعاء الأدوات الصحيحة والمحدثة من قوقل (تم تصحيح الروابط)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";

        // إعدادات فايربيز المكتملة الخاصة بمشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyBEifSy8WgG4Z3p9gbuwg1fX2n0udxE61c",
            authDomain: "misaki-6c550.firebaseapp.com",
            databaseURL: "https://misaki-6c550-default-rtdb.firebaseio.com",
            projectId: "misaki-6c550",
            storageBucket: "misaki-6c550.firebasestorage.app",
            messagingSenderId: "106875309382",
            appId: "1:106875309382:web:804967b1184b9cd9daa947",
            measurementId: "G-4HM1ZQJBSY"
        };

        // تفعيل قاعدة البيانات
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 2. مراقبة وجلب اللوحات الفنية المعروضة على الإنترنت فوراً
        const galleryRef = ref(db, 'galleryArtworksList');
        
        onValue(galleryRef, (snapshot) => {
            const container = document.getElementById('galleryContainer');
            container.innerHTML = ''; // تنظيف الحاوية لمنع التكرار عند إضافة لوحة جديدة

            const data = snapshot.val();
            if (data) {
                // ترتيب اللوحات الفنية بحيث تظهر الأحدث أولاً بناءً على الـ Timestamp
                const sortedKeys = Object.keys(data).sort((a, b) => {
                    return (data[b].timestamp || 0) - (data[a].timestamp || 0);
                });

                // عرض كل لوحة فنية داخل الـ HTML الخاص بالمعرض
                sortedKeys.forEach((key) => {
                    const art = data[key];
                    
                    // قالب الكرت المخصص للوحة (يحتوي على الصورة، العنوان، والوصف البرمجي)
                    const artHTML = `
                        <div class="art-card" id="${key}">
                            <img src="${art.image}" alt="${art.title}" class="art-image" onerror="this.src='https://placehold.co/600x400'">
                            <div class="art-info">
                                <h3 class="art-title">${art.title}</h3>
                                <p class="art-description">${art.description ? art.description.replace(/\n/g, '<br>') : ''}</p>
                            </div>
                        </div>
                    `;
                    container.innerHTML += artHTML; // ضخ اللوحة داخل الصفحة الحية
                });
            } else {
                // في حال عدم وجود لوحات فنية معروضة بالسيرفر
                container.innerHTML = '<p class="no-art">There are no paintings currently on display.</p>';
            }
        });
    </script>
</body>
</html>
